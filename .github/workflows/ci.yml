name: MoonSurface validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm-gc]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o /tmp/moon-install.sh
          bash /tmp/moon-install.sh '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify compiler
        run: |
          moon version --all
          moonc -v | grep -F 'v0.10.14+7d59c7ec9'
      - name: Install independent geometry checker
        run: python -m pip install -r requirements-dev.txt
      - name: Check, build, test, examples, reference and package consumer
        run: python tools/verify.py --target ${{ matrix.target }}
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}-evidence
          path: artifacts/*.json
          if-no-files-found: warn
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MoonBit
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: '0.10.14+7d59c7ec9'
        run: |
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP/moon-install.ps1"
          & "$env:RUNNER_TEMP/moon-install.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE/.moon/bin" >> $env:GITHUB_PATH
      - name: Verify compiler
        shell: pwsh
        run: |
          moon version --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compilerVersion = moonc -v
          if ($compilerVersion -notmatch 'v0\.10\.14\+7d59c7ec9') { throw "Unexpected compiler: $compilerVersion" }
      - name: Install independent geometry checker
        run: python -m pip install -r requirements-dev.txt
      - name: Check, build, test, examples, reference and package consumer
        run: python tools/verify.py --target native
      - name: Install pinned MeshLab reference
        run: python -m pip install -r requirements-reference.txt
      - name: Real models and geometry-only MeshLab comparison
        run: python tools/model_verify.py --target js --real --reference
      - name: Exercise Windows Node file adapter
        run: python tools/cli_check.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          path: artifacts/*.json
          if-no-files-found: warn
